name: BongoCat Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set output
        id: vars
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate changelog
        run: npx changelogithub --draft --name ${{ steps.vars.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build-app:
    needs: create-release
    permissions:
      contents: write

    strategy:
      fail-fast: false

      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin

          - platform: macos-latest
            target: x86_64-apple-darwin

          - platform: windows-latest
            target: x86_64-pc-windows-msvc

          - platform: windows-latest
            target: aarch64-pc-windows-msvc

          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            patchelf \
            xdg-utils \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libasound2-dev \
            libclang-dev \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-pipewire

      - name: Install front-end dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows/macOS
        if: matrix.platform != 'ubuntu-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          CI: false
          PLATFORM: ${{ matrix.platform }}
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: BongoCat ${{ github.ref_name }}
          releaseBody: ''
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Build Linux AppImage
        if: matrix.platform == 'ubuntu-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          CI: false
          PLATFORM: ${{ matrix.platform }}
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: BongoCat ${{ github.ref_name }}
          releaseBody: ''
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles appimage

      - name: Rebuild Linux AppImage
        if: startsWith(matrix.platform, 'ubuntu')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          set -euo pipefail

          APPIMAGE="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name 'BongoCat*.AppImage' \
            | head -n1)"

          if [ -z "$APPIMAGE" ]; then
            echo "ERRO: AppImage não encontrado"
            find "$GITHUB_WORKSPACE" -name '*.AppImage' || true
            exit 1
          fi

          echo "==> AppImage original:"
          echo "$APPIMAGE"

          chmod +x "$APPIMAGE"

          echo "==> Extraindo AppImage..."

          rm -rf squashfs-root
          "$APPIMAGE" --appimage-extract

          echo "==> Bibliotecas Wayland presentes antes da correção:"
          find squashfs-root/usr/lib -maxdepth 1 \
            -type f \
            \( \
              -name 'libwayland*.so*' \
            \) \
            -print || true

          echo "==> Removendo bibliotecas Wayland empacotadas..."

          find squashfs-root/usr/lib \
            -type f \
            \( \
              -name 'libwayland-client.so*' \
              -o -name 'libwayland-cursor.so*' \
              -o -name 'libwayland-egl.so*' \
              -o -name 'libwayland-server.so*' \
              -o -name 'libpipewire*.so*' \
              -o -name 'libspa-*.so*' \
            \) \
            -print -delete

          echo "==> Bibliotecas Wayland restantes:"
          find squashfs-root/usr/lib \
            -type f \
            -name 'libwayland*.so*' \
            -print || true

          echo "==> Corrigindo GDK_BACKEND..."

          find squashfs-root -type f \
            \( -name 'AppRun' -o -name '*.sh' \) \
            -print0 \
            | xargs -0 sed -i \
              -e 's/export GDK_BACKEND=x11/export GDK_BACKEND="${GDK_BACKEND:-wayland,x11}"/g' \
            || true

          echo "==> Verificando AppRun..."

          grep -R "GDK_BACKEND" \
            squashfs-root/AppRun \
            squashfs-root/usr/bin \
            2>/dev/null || true

          echo "==> Baixando appimagetool..."

          curl -fsSL \
            -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage

          chmod +x appimagetool.AppImage

          echo "==> Reempacotando..."

          rm -f "$APPIMAGE"

          ARCH=x86_64 \
            ./appimagetool.AppImage \
            squashfs-root \
            "$APPIMAGE"

          chmod +x "$APPIMAGE"

          echo "==> Assinando..."

          pnpm tauri signer sign "$APPIMAGE"

          echo "==> Enviando para o release..."

          gh release upload \
            "${{ github.ref_name }}" \
            "$APPIMAGE" \
            "$APPIMAGE.sig" \
            --clobber
